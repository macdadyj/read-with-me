# Cloud Run service manifest for montano-349204 / us-central1.
# gcloud run services replace deploy/cloud-run-service.yaml --region=us-central1 --project=montano-349204
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: read-with-me
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: read-with-me@montano-349204.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: gcr.io/montano-349204/read-with-me:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: montano-349204
            - name: REGION
              value: us-central1
            - name: GCP_LOCATION
              value: us-central1
            - name: SPEECH_LOCATION
              value: us
            - name: GCS_BUCKET
              value: gs://montano-349204-read-with-me
            - name: SAVE_SESSION
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
